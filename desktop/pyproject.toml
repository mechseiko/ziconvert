[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2dxf-desktop"
version = "0.2.0"
description = "zicengine desktop app — a Tkinter front end for the img2dxf tracing engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Saraogi" }, { name = "mechseiko" }]
keywords = ["laser", "cnc", "dxf", "svg", "tracing", "opencv", "tkinter", "gui"]

# Unpinned on purpose. In a monorepo checkout both packages are installed
# editable from the same commit, and a version floor here would only ever be a
# second place to forget to bump. What matters is that the engine is present;
# core/pyproject.toml owns its own dependency list.
dependencies = ["img2dxf"]

[project.optional-dependencies]
# Drag-and-drop only; the GUI falls back to the Open button without it.
dnd = ["tkinterdnd2>=0.4"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
img2dxf-desktop = "img2dxf_gui:launch"

[tool.setuptools.packages.find]
include = ["img2dxf_gui*"]
