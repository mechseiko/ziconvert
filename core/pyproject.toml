[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2dxf"
version = "0.2.0"
description = "zicengine core — trace PNG/JPEG images into laser-ready DXF and SVG contours"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dxf", "svg", "laser", "cnc", "tracing", "vectorization", "cad", "cam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "ezdxf>=1.3",
    "pyclipper>=1.3",
]

[project.optional-dependencies]
# AI super-resolution. Install this *instead of* the base opencv, not alongside
# it: both distributions provide a module named cv2, and whichever lands last
# shadows the other. contrib is a strict superset, so nothing is lost.
sr = ["opencv-contrib-python-headless>=4.10"]
# Real-ESRGAN through the ncnn runtime. Needs a Vulkan-capable GPU driver and
# ships no Python 3.13 wheel on every platform yet, so it stays its own extra
# and the engine falls back to the OpenCV and classical paths without it.
sr-esrgan = ["realesrgan-ncnn-py>=0.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mechseiko/ziconvert"
Repository = "https://github.com/mechseiko/ziconvert"
Issues = "https://github.com/mechseiko/ziconvert/issues"

[project.scripts]
img2dxf = "img2dxf.cli:main"

[tool.setuptools.packages.find]
include = ["img2dxf*"]

[tool.setuptools.package-data]
img2dxf = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E/F/W are the ones that catch real bugs; the rest is style this codebase
# already follows by hand and enforcing it would only add churn.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # `from __future__ import annotations` is used everywhere on purpose, so
    # PEP 604 unions in signatures are fine on 3.10.
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
